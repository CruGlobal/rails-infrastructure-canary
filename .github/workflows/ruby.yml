name: Ruby

on:
  pull_request:
    branches: [master]
  push:
    branches: [master,staging]

# Cancel superseded runs on the same PR; each push run gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test

    steps:
      - name: Check out files
        uses: actions/checkout@v7

      # ubuntu-latest ships no libvips, but the fleet's Docker images carry
      # 8.15-8.17. Rails 8.0.5.1+ checks BOTH libvips >= 8.13 and ruby-vips
      # >= 2.2.1 at boot (CVE-2026-66066), so without this the guard would trip
      # on the missing system library and mask the gem version it is really
      # testing — see the ruby-vips fixture pin in the Gemfile (ADL-23).
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}

      - name: Rails tests
        run: bundle exec rails test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}

      - name: Brakeman
        # --ensure-latest dropped (no proposer exists under security-only;
        # the flag reds lint on brakeman release day).
        run: bundle exec brakeman -A -q --no-pager

      - name: StandardRB
        run: bundle exec standardrb --format simple

  # Known-vulnerability status. NOT a required check, so a backlog never deadlocks
  # merges. Dependabot security-only opens the fixes it can; this is the visible
  # backstop, and groundcru's nightly rubysec sweep reports what Dependabot misses.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v7

      # ubuntu-latest ships no libvips, but the fleet's Docker images carry
      # 8.15-8.17. Rails 8.0.5.1+ checks BOTH libvips >= 8.13 and ruby-vips
      # >= 2.2.1 at boot (CVE-2026-66066), so without this the guard would trip
      # on the missing system library and mask the gem version it is really
      # testing — see the ruby-vips fixture pin in the Gemfile (ADL-23).
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}

      - name: Bundle audit
        run: bin/bundler-audit check --update ${{ vars.CVE_IGNORES && format('--ignore {0}', vars.CVE_IGNORES) }}

      - name: JavaScript audit
        run: bin/importmap audit
